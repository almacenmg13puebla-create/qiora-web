
name: Generar APK QIORA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: qiora-web
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli typescript

      - name: Preparar aplicación QIORA
        working-directory: qiora-web
        run: |
          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>QIORA</title>
          </head>
          <body>
            <p>Conectando con QIORA...</p>
          </body>
          </html>
          EOF

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.qiora.app',
            appName: 'QIORA',
            webDir: 'www',
            server: {
              url: 'https://sistematraspasos.com/',
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Preparar Android
        working-directory: qiora-web
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK
        working-directory: qiora-web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: QIORA-APK
          path: qiora-web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
