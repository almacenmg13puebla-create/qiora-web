
name: Generar APK QIORA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar QIORA
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: qiora-web
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7

      - name: Preparar aplicación
        working-directory: qiora-web
        run: |
          mkdir -p www

          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.qiora.app",
            "appName": "QIORA",
            "webDir": "www",
            "server": {
              "url": "https://sistematraspasos.com/",
              "cleartext": false
            }
          }
          EOF

          echo '<html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>Conectando con QIORA...</body></html>' > www/index.html

      - name: Preparar Android
        working-directory: qiora-web
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: qiora-web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: QIORA-APK
          path: qiora-web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
